<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0c" />
    <title>圆圆 · 四种模样</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="studies-page">
    <header class="study-header">
      <a class="study-back" href="/#yuanyuan"><i data-lucide="arrow-left" aria-hidden="true"></i><span>Snowman<span class="wordmark-dot">.</span></span></a>
      <span>圆圆的造型小样</span>
    </header>
    <main class="study-main">
      <div class="study-heading">
        <div><h1>圆圆，四种模样<span>。</span></h1><p>金渐层 <span>/</span> 2025 年 2 月出生 <span>/</span> <span id="study-age">1 岁 9 个月</span></p></div>
        <i data-lucide="paw-print" aria-hidden="true"></i>
      </div>
      <fieldset class="study-grid">
        <legend class="sr-only">选择圆圆的造型</legend>
        <label class="study-option" data-variant="a">
          <div class="option-heading"><h2><span>A</span> 软团子猫</h2><input type="radio" name="cat-style" value="a" aria-label="选择 A 软团子猫" /></div>
          <canvas width="800" height="560" role="img" aria-label="A：短绒毛的金色团子小猫，趴着、藏起短腿，眼神跟随鼠标。"></canvas>
        </label>
        <label class="study-option" data-variant="b">
          <div class="option-heading"><h2><span>B</span> 像素小居民</h2><input type="radio" name="cat-style" value="b" aria-label="选择 B 像素小居民" /></div>
          <canvas width="800" height="560" role="img" aria-label="B：金色像素小猫，细碎像素构成蓬松的毛边，眼神跟随鼠标。"></canvas>
        </label>
        <label class="study-option" data-variant="c">
          <div class="option-heading"><h2><span>C</span> 探头小猫</h2><input type="radio" name="cat-style" value="c" aria-label="选择 C 探头小猫" /></div>
          <canvas width="800" height="560" role="img" aria-label="C：脸颊毛茸茸的金色小猫从边缘探头，两只小爪搭在边缘，眼神跟随鼠标。"></canvas>
        </label>
        <label class="study-option" data-variant="d">
          <div class="option-heading"><h2><span>D</span> 绘本小猫</h2><input type="radio" name="cat-style" value="d" aria-label="选择 D 绘本小猫" /></div>
          <canvas width="800" height="560" role="img" aria-label="D：蜷坐的金色绘本小猫，蓬松尾巴绕着身体，细碎笔触表现绒毛，眼神跟随鼠标。"></canvas>
        </label>
      </fieldset>
      <footer class="study-footer">
        <p id="study-selection" role="status" aria-live="polite">尚未选择</p>
        <a href="/#yuanyuan">回到圆圆 <i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
      </footer>
    </main>
    <script type="module" src="/cat-studies.js"></script>
  </body>
</html>
